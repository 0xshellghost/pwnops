version: '3.8'

services:
  # The PostgreSQL database for the application
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-pwnops}
    ports:
      - "5432:5432"
    volumes:
      - pwnops_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pwnops}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The Background Scan Worker (includes all security tools)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: always
    ports:
      - "10000:10000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password123}@db:5432/${POSTGRES_DB:-pwnops}
      - WORKER_POLL_INTERVAL=3000
      - WORKER_MAX_CONCURRENT=3
      - PORT=10000
    # Uses the local codebase for development without needing rebuilds
    volumes:
      - ./worker:/app/worker
      - ./lib:/app/lib
      - ./prisma:/app/prisma

volumes:
  pwnops_db_data:
